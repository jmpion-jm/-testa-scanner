name: NASDAQ 100 월봉 MA10 스캔 (매월 말일)

on:
  schedule:
    - cron: '20 7 28-31 * *'   # 매월 28~31일 UTC 07:20 = KST 16:20
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: config.json 생성
        run: echo '${{ secrets.CONFIG_JSON }}' > config.json

      - name: NASDAQ 100 스캔 실행
        run: python -u nasdaq100_scan.py
