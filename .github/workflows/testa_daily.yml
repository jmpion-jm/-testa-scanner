name: 테스타 한국주식 일봉 스캔

on:
  schedule:
    # KST 16:00 = UTC 07:00 | 평일(월~금)만 실행
    - cron: '0 7 * * 1-5'
  workflow_dispatch:   # GitHub 웹에서 수동 실행 버튼

jobs:
  testa-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements_testa.txt

      - name: 패키지 설치
        run: pip install -r requirements_testa.txt

      - name: 테스타 스캔 실행
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python testa_scan.py
