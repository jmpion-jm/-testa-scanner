name: 미국주식 월봉×주봉 이중필터 스캔 (평일 16:40 KST)

on:
  schedule:
    - cron: '40 7 * * 1-5'   # UTC 07:40 = KST 16:40, 월~금
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: config.json 생성
        run: echo '${{ secrets.CONFIG_JSON }}' > config.json

      - name: 월봉×주봉 이중필터 스캔 실행
        run: python -u us_weekly_scan.py slack
