name: 월봉MA10 알림 (금요일 주간 + 월말 미국장 마감 후)

on:
  schedule:
    - cron: '0 7 * * 5'        # 매주 금요일 UTC 07:00 = KST 16:00 (주간)
    - cron: '0 22 28-31 * *'   # 매월 28~31일 UTC 22:00 = KST 다음날 07:00 — 미국장 마감 후. 말일 여부는 스크립트(market_time.py)가 판단
  workflow_dispatch:

permissions:
  contents: write

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 최신 검증기록 받기 (앞 워크플로우가 저장한 signal_log.json 이어받기)
        run: git pull -q --ff-only origin main || true

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: config.json 생성
        # 2026-11-01: echo '...'는 값이 비거나 깨져도 성공으로 넘어갔다 → 환경변수로 받아 JSON 검사 후 명확히 실패
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: |
          printf '%s' "$CONFIG_JSON" > config.json
          python3 -c "import json; json.load(open('config.json', encoding='utf-8'))" || { echo "::error::CONFIG_JSON이 비었거나 올바른 JSON이 아님 — GitHub Settings > Secrets > Actions에서 PC의 config.json 전체를 다시 붙여넣을 것"; exit 1; }

      - name: Google 인증 파일 생성
        env:
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
        run: |
          printf '%s' "$GOOGLE_CREDS_JSON" > credentials.json
          python3 -c "import json; json.load(open('credentials.json', encoding='utf-8'))" || { echo "::error::GOOGLE_CREDS_JSON이 비었거나 올바른 JSON이 아님"; exit 1; }

      - name: 월봉MA10 알림 실행
        env:
          GSHEET_CREDS_PATH: credentials.json
        run: python -u slack_alert.py auto

      - name: 신호 파일 커밋 (로컬 감시목록 자동등록용)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add us_signals.json

          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 스킵"
            exit 0
          fi

          git commit -m "us signals $(date -u +'%Y-%m-%d')"

          for i in 1 2 3; do
            if git push; then
              echo "push 성공"
              exit 0
            fi
            echo "push 실패, rebase 후 재시도 ($i/3)"
            git pull --rebase origin main
            sleep 3
          done

          echo "::error::us_signals.json push 3회 모두 실패 — 로컬 감시목록 자동등록이 옛날 데이터를 읽게 됨"
          exit 1

      # 2026-09-30: signal_log.json이 gitignore라 GitHub에선 매번 빈 파일로 시작 → 청산이 영원히 기록 안 되고
      # 기록이 매달 버려졌다(로컬 작업이 돌던 9/26까지는 PC 파일이 이어져서 안 드러남). 실행 후 저장소에 병합 저장.
      - name: 검증기록 저장 (signal_log.json — 다음 실행이 이어받음)
        if: always()
        run: |
          [ -f signal_log.json ] || { echo "기록 파일 없음 — 스킵"; exit 0; }
          git diff --quiet -- signal_log.json && { echo "검증기록 변경 없음 — 스킵"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp signal_log.json "$RUNNER_TEMP/mine.json"
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python signal_tracker.py merge "$RUNNER_TEMP/mine.json"
            git add signal_log.json
            if git diff --cached --quiet; then echo "병합 후 변경 없음"; exit 0; fi
            git commit -q -m "tracker log $(date -u +'%Y-%m-%d %H:%M')"
            if git push -q origin HEAD:main; then echo "검증기록 push 성공"; exit 0; fi
            echo "push 실패, 재시도 ($i/3)"; sleep 5
          done
          echo "::error::signal_log.json 저장 3회 실패 — 이번 실행의 검증기록이 다음 실행에 이어지지 않음"
          exit 1

      - name: 실패 알림 (사용자 채널)
        if: failure()
        run: python3 notify_failure.py
