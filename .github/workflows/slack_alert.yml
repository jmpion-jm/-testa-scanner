name: 월봉MA10 알림 (금요일 주간 + 월말)

on:
  schedule:
    - cron: '0 7 * * 5'        # 매주 금요일 UTC 07:00 = KST 16:00 (주간)
    - cron: '10 7 28-31 * *'   # 매월 28~31일 UTC 07:10 = KST 16:10 (월말)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: config.json 생성
        run: echo '${{ secrets.CONFIG_JSON }}' > config.json

      - name: Google 인증 파일 생성
        run: echo '${{ secrets.GOOGLE_CREDS_JSON }}' > credentials.json

      - name: 월봉MA10 알림 실행
        env:
          GSHEET_CREDS_PATH: credentials.json
        run: python -u slack_alert.py auto

      - name: 신호 파일 커밋 (로컬 감시목록 자동등록용)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add us_signals.json

          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 스킵"
            exit 0
          fi

          git commit -m "us signals $(date -u +'%Y-%m-%d')"

          for i in 1 2 3; do
            if git push; then
              echo "push 성공"
              exit 0
            fi
            echo "push 실패, rebase 후 재시도 ($i/3)"
            git pull --rebase origin main
            sleep 3
          done

          echo "::error::us_signals.json push 3회 모두 실패 — 로컬 감시목록 자동등록이 옛날 데이터를 읽게 됨"
          exit 1
