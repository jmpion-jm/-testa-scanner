name: 테스타 아침 확인 (평일 09:10 KST)

on:
  schedule:
    - cron: '10 0 * * 1-5'  # UTC 00:10 = KST 09:10, 월~금
  workflow_dispatch:

jobs:
  morning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 아침 진입 확인 실행
        env:
          SLACK_TESTA_WEBHOOK_URL: ${{ secrets.SLACK_TESTA_WEBHOOK_URL }}
        run: python -u testa_morning.py
