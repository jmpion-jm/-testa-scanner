name: 테스타 아침 확인 (평일 09:10 KST)

# 2026-09-26 사용자 결정(월봉매매법만 자동 실행)으로 스케줄 중지 — 수동 실행만 가능
on:
  workflow_dispatch:

jobs:
  morning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 아침 진입 확인 실행
        env:
          SLACK_TESTA_WEBHOOK_URL: ${{ secrets.SLACK_TESTA_WEBHOOK_URL }}
        run: python -u testa_morning.py
