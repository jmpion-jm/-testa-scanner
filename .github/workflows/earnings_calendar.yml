name: 실적발표일 알림 (매주 월요일 08:00 KST)

on:
  schedule:
    - cron: '0 23 * * 0'   # UTC 23:00 일요일 = KST 08:00 월요일
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: config.json 생성
        run: echo '${{ secrets.CONFIG_JSON }}' > config.json

      - name: 실적발표일 스캔 실행
        run: python -u earnings_calendar.py slack
