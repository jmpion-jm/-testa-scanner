name: S&P 500 월봉 MA10 스캔 (매월 말일)

on:
  schedule:
    - cron: '30 22 28-31 * *'   # 매월 28~31일 UTC 22:30 = KST 다음날 07:30 — 미국장 마감 후, 말일 아니면 스크립트가 스킵
  workflow_dispatch:

permissions:
  contents: write   # 검증기록(signal_log.json) 저장용

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: 최신 검증기록 받기 (앞 워크플로우가 저장한 signal_log.json 이어받기)
        run: git pull -q --ff-only origin main || true

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: config.json 생성
        # 2026-11-01: echo '...'는 값이 비거나 깨져도 성공으로 넘어갔다 → 환경변수로 받아 JSON 검사 후 명확히 실패
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: |
          printf '%s' "$CONFIG_JSON" > config.json
          python3 -c "import json; json.load(open('config.json', encoding='utf-8'))" || { echo "::error::CONFIG_JSON이 비었거나 올바른 JSON이 아님 — GitHub Settings > Secrets > Actions에서 PC의 config.json 전체를 다시 붙여넣을 것"; exit 1; }

      - name: S&P 500 스캔 실행
        run: python -u sp500_scan.py

      # 2026-09-30: signal_log.json이 gitignore라 GitHub에선 매번 빈 파일로 시작 → 기록이 매달 버려졌다. 병합 저장.
      - name: 검증기록 저장 (signal_log.json — 다음 실행이 이어받음)
        if: always()
        run: |
          [ -f signal_log.json ] || { echo "기록 파일 없음 — 스킵"; exit 0; }
          git diff --quiet -- signal_log.json && { echo "검증기록 변경 없음 — 스킵"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp signal_log.json "$RUNNER_TEMP/mine.json"
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python signal_tracker.py merge "$RUNNER_TEMP/mine.json"
            git add signal_log.json
            if git diff --cached --quiet; then echo "병합 후 변경 없음"; exit 0; fi
            git commit -q -m "tracker log $(date -u +'%Y-%m-%d %H:%M')"
            if git push -q origin HEAD:main; then echo "검증기록 push 성공"; exit 0; fi
            echo "push 실패, 재시도 ($i/3)"; sleep 5
          done
          echo "::error::signal_log.json 저장 3회 실패 — 이번 실행의 검증기록이 다음 실행에 이어지지 않음"
          exit 1

      - name: 실패 알림 (사용자 채널)
        if: failure()
        run: python3 notify_failure.py
