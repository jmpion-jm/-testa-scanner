name: 이슈섹터 신흥 종목 발굴 (매월 말일 미국장 마감 후)

on:
  schedule:
    - cron: '50 22 28-31 * *'   # 매월 28~31일 UTC 22:50 = KST 다음날 07:50 — 말일 아니면 스크립트(market_time)가 스킵
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: config.json 생성
        run: echo '${{ secrets.CONFIG_JSON }}' > config.json

      - name: 이슈섹터 스캔 실행
        run: python -u discovery_scan.py
