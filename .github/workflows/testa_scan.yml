name: 테스타 스캔 (평일 16:00 KST)

on:
  schedule:
    - cron: '0 7 * * 1-5'   # UTC 07:00 = KST 16:00, 월~금
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 테스타 스캔 실행
        env:
          SLACK_TESTA_WEBHOOK_URL: ${{ secrets.SLACK_TESTA_WEBHOOK_URL }}
        run: python -u testa_scan.py

      - name: 신호 파일 커밋 (다음날 아침 확인용)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add testa_signals.json

          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 스킵"
            exit 0
          fi

          git commit -m "testa signals $(date -u +'%Y-%m-%d')"

          # main이 그 사이 앞서갔으면(다른 워크플로우·수동 push) rebase 후 재시도
          for i in 1 2 3; do
            if git push; then
              echo "push 성공"
              exit 0
            fi
            echo "push 실패, rebase 후 재시도 ($i/3)"
            git pull --rebase origin main
            sleep 3
          done

          echo "::error::신호 파일 push 3회 모두 실패 — 다음날 아침 확인 알림이 옛날 데이터를 읽게 됨"
          exit 1
