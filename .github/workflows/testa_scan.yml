name: 테스타 스캔 (평일 16:00 KST)

on:
  schedule:
    - cron: '0 7 * * 1-5'   # UTC 07:00 = KST 16:00, 월~금
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 테스타 스캔 실행
        env:
          SLACK_TESTA_WEBHOOK_URL: ${{ secrets.SLACK_TESTA_WEBHOOK_URL }}
        run: python -u testa_scan.py

      - name: 신호 파일 커밋 (다음날 아침 확인용)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add testa_signals.json
          git commit -m "testa signals $(date -u +'%Y-%m-%d')" || echo "변경 없음"
          # main이 그 사이 앞서갔으면(다른 워크플로우·수동 push) rebase 후 재시도
          # (push 거부로 이 스텝 전체가 실패해도 스캔 자체는 이미 끝났고 슬랙도 이미 갔음)
          for i in 1 2 3; do
            git push && break
            echo "push 실패, rebase 후 재시도 ($i/3)"
            git pull --rebase origin main
            sleep 3
          done
