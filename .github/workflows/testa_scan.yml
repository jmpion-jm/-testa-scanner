name: 테스타 스캔 (평일 16:00 KST)

on:
  schedule:
    - cron: '0 7 * * 1-5'   # UTC 07:00 = KST 16:00, 월~금
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 테스타 스캔 실행
        env:
          SLACK_TESTA_WEBHOOK_URL: ${{ secrets.SLACK_TESTA_WEBHOOK_URL }}
        run: python -u testa_scan.py

      - name: 신호 파일 커밋 (다음날 아침 확인용)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add testa_signals.json
          git commit -m "testa signals $(date -u +'%Y-%m-%d')" || echo "변경 없음"
          git push
