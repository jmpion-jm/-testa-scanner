name: 테스타 스캔 (평일 16:00 KST)

on:
  schedule:
    - cron: '0 7 * * 1-5'   # UTC 07:00 = KST 16:00, 월~금
  workflow_dispatch:          # 수동 실행 버튼

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: config.json 생성
        run: echo '${{ secrets.CONFIG_JSON }}' > config.json

      - name: Google 인증 파일 생성
        run: echo '${{ secrets.GOOGLE_CREDS_JSON }}' > credentials.json

      - name: 테스타 스캔 실행
        env:
          GSHEET_CREDS_PATH: credentials.json
        run: python -u testa_scan.py

      - name: 신호 파일 커밋 (다음날 아침 확인용)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add testa_signals.json
          git commit -m "testa signals update $(date -u +'%Y-%m-%d')" || echo "변경 없음"
          git push
