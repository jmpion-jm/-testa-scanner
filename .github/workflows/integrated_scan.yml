name: '월봉매매법 통합 스캔 (원서 원칙 — 월말 확정 돌파·지지 + 패턴·매출이익 우선순위, 평일 16:45 KST)'

on:
  schedule:
    - cron: '45 7 * * 1-5'   # UTC 07:45 = KST 16:45, 월~금 (us_weekly_scan.py와 5분 분산)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: config.json 생성
        # 2026-11-01: echo '...'는 값이 비거나 깨져도 성공으로 넘어갔다 → 환경변수로 받아 JSON 검사 후 명확히 실패
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: |
          printf '%s' "$CONFIG_JSON" > config.json
          python3 -c "import json; json.load(open('config.json', encoding='utf-8'))" || { echo "::error::CONFIG_JSON이 비었거나 올바른 JSON이 아님 — GitHub Settings > Secrets > Actions에서 PC의 config.json 전체를 다시 붙여넣을 것"; exit 1; }

      - name: 통합 스캔 실행 (월봉+주봉+패턴+매출·영업이익성장)
        run: python -u integrated_scan.py slack

      - name: 실패 알림 (사용자 채널)
        if: failure()
        run: python3 notify_failure.py
