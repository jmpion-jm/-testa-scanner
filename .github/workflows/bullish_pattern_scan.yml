name: 상승 반전 패턴 스캔 (쌍바닥/삼중바닥/역H&S, 매월 말일)

on:
  schedule:
    - cron: '40 22 28-31 * *'   # 매월 28~31일 UTC 22:40 = KST 다음날 07:40 — 미국장 마감 후, 말일 아니면 스크립트가 스킵
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: config.json 생성
        run: echo '${{ secrets.CONFIG_JSON }}' > config.json

      - name: 상승 반전 패턴 스캔 실행 (NASDAQ100)
        run: python -u bullish_pattern_scan.py nasdaq100
