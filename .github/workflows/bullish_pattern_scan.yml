name: 상승 반전 패턴 스캔 (쌍바닥/삼중바닥/역H&S, 매월 말일)

on:
  schedule:
    - cron: '40 7 28-31 * *'   # 매월 28~31일 UTC 07:40 = KST 16:40 (다른 월봉 스캔과 시간 분산)
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: config.json 생성
        run: echo '${{ secrets.CONFIG_JSON }}' > config.json

      - name: 상승 반전 패턴 스캔 실행 (NASDAQ100)
        run: python -u bullish_pattern_scan.py nasdaq100
