name: 상승 반전 패턴 스캔 (쌍바닥/삼중바닥/역H&S, 매월 말일)

on:
  schedule:
    - cron: '40 22 28-31 * *'   # 매월 28~31일 UTC 22:40 = KST 다음날 07:40 — 미국장 마감 후, 말일 아니면 스크립트가 스킵
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: config.json 생성
        # 2026-11-01: echo '...'는 값이 비거나 깨져도 성공으로 넘어갔다 → 환경변수로 받아 JSON 검사 후 명확히 실패
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: |
          printf '%s' "$CONFIG_JSON" > config.json
          python3 -c "import json; json.load(open('config.json', encoding='utf-8'))" || { echo "::error::CONFIG_JSON이 비었거나 올바른 JSON이 아님 — GitHub Settings > Secrets > Actions에서 PC의 config.json 전체를 다시 붙여넣을 것"; exit 1; }

      - name: 상승 반전 패턴 스캔 실행 (NASDAQ100)
        run: python -u bullish_pattern_scan.py nasdaq100

      - name: 실패 알림 (사용자 채널)
        if: failure()
        run: python3 notify_failure.py
