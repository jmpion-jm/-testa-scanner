name: 투자 시스템 종합 검증 (매주 월요일)

on:
  schedule:
    - cron: '0 8 * * 1'   # 매주 월요일 UTC 08:00 = KST 17:00
  workflow_dispatch:       # 수동 실행 가능

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: config.json 생성
        # 2026-11-01: echo '...'는 값이 비거나 깨져도 성공으로 넘어갔다 → 환경변수로 받아 JSON 검사 후 명확히 실패
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: |
          printf '%s' "$CONFIG_JSON" > config.json
          python3 -c "import json; json.load(open('config.json', encoding='utf-8'))" || { echo "::error::CONFIG_JSON이 비었거나 올바른 JSON이 아님 — GitHub Settings > Secrets > Actions에서 PC의 config.json 전체를 다시 붙여넣을 것"; exit 1; }

      - name: 시스템 검증 실행
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -u verify_system.py

      - name: 실패 알림 (사용자 채널)
        if: failure()
        run: python3 notify_failure.py
