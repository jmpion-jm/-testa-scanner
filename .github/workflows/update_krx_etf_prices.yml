name: 구글시트 국내 ETF 단가 자동 업데이트 (평일 장중 15분마다)

on:
  schedule:
    # 평일 UTC 00:00~06:45 = KST 09:00~15:45, 15분 간격
    # (한국장 09:00~15:30 전체 + 마감 직후 15:45 한 번 더 커버)
    - cron: '*/15 0-6 * * 1-5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: Google 인증 파일 생성
        run: echo '${{ secrets.GOOGLE_CREDS_JSON }}' > credentials.json

      - name: 국내 ETF 단가 업데이트 실행
        env:
          GSHEET_CREDS_PATH: credentials.json
        run: python -u update_krx_etf_prices.py
