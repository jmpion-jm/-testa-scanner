name: '매매 자동 감지 + 검증기록 (구글시트, 매일 08:00 KST)'

# 2026-09-26 사용자 요청: 매수·매도를 자동으로 알 수 있게. 저장소가 공개라서 보유 내역·매매기록은
# 커밋하지 않고 전부 구글시트 탭('_보유스냅샷', '매매기록(자동)')에 저장한다 — trade_detector.py 참고.
on:
  schedule:
    - cron: '0 23 * * *'   # 매일 UTC 23:00 = KST 08:00 (주말 포함 — 시트는 주말에도 고칠 수 있음)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: config.json 생성
        # 2026-11-01: echo '...'는 값이 비거나 깨져도 성공으로 넘어갔다 → 환경변수로 받아 JSON 검사 후 명확히 실패
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: |
          printf '%s' "$CONFIG_JSON" > config.json
          python3 -c "import json; json.load(open('config.json', encoding='utf-8'))" || { echo "::error::CONFIG_JSON이 비었거나 올바른 JSON이 아님 — GitHub Settings > Secrets > Actions에서 PC의 config.json 전체를 다시 붙여넣을 것"; exit 1; }

      - name: Google 인증 파일 생성
        env:
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
        run: |
          printf '%s' "$GOOGLE_CREDS_JSON" > credentials.json
          python3 -c "import json; json.load(open('credentials.json', encoding='utf-8'))" || { echo "::error::GOOGLE_CREDS_JSON이 비었거나 올바른 JSON이 아님"; exit 1; }

      - name: 매매 감지 실행
        env:
          GSHEET_CREDS_PATH: credentials.json
        run: python -u trade_detector.py

      - name: 검증기록 갱신 (추천·실제 성과 — 월이 바뀌면 슬랙 요약)
        if: always()
        env:
          GSHEET_CREDS_PATH: credentials.json
        run: python -u performance_tracker.py

      - name: 실패 알림 (사용자 채널)
        if: failure()
        run: python3 notify_failure.py
