name: 매매 자동 감지 (구글시트 보유수량 변화 → 규칙 판정, 매일 08:00 KST)

# 2026-09-26 사용자 요청: 매수·매도를 자동으로 알 수 있게. 저장소가 공개라서 보유 내역·매매기록은
# 커밋하지 않고 전부 구글시트 탭('_보유스냅샷', '매매기록(자동)')에 저장한다 — trade_detector.py 참고.
on:
  schedule:
    - cron: '0 23 * * *'   # 매일 UTC 23:00 = KST 08:00 (주말 포함 — 시트는 주말에도 고칠 수 있음)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: config.json 생성
        run: echo '${{ secrets.CONFIG_JSON }}' > config.json

      - name: Google 인증 파일 생성
        run: echo '${{ secrets.GOOGLE_CREDS_JSON }}' > credentials.json

      - name: 매매 감지 실행
        env:
          GSHEET_CREDS_PATH: credentials.json
        run: python -u trade_detector.py
